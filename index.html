<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard de Campanhas</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0d14;color:#e1e7ef}
    header{background:linear-gradient(135deg,#11131c,#1a1d27);border-bottom:1px solid #1e1b4b;padding:20px 32px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
    header h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,#f59e0b,#fb923c,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
    .container{max-width:1200px;margin:0 auto;padding:24px 32px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
    .card{background:linear-gradient(135deg,#11131c,#1a1d27);border:1px solid #1e1b4b;border-radius:14px;padding:20px 24px;transition:.2s}
    .card:hover{border-color:#f59e0b;transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,.08)}
    .card .label{font-size:14px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
    .card .value{font-size:32px;font-weight:800;margin-top:3px;color:#f0f2f8;line-height:1.2}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:768px){.grid-2,.cards{grid-template-columns:1fr}.container{padding:16px}}
    .chart-box{background:linear-gradient(135deg,#11131c,#1a1d27);border:1px solid #1e1b4b;border-radius:14px;padding:20px;margin-bottom:20px;transition:.2s}
    .chart-box:hover{border-color:#78350f}
    .chart-box h2{font-size:15px;font-weight:700;margin-bottom:14px;color:#fcd34d;text-transform:uppercase;letter-spacing:.7px;padding-left:10px;border-left:3px solid #f59e0b}
    .chart-box h2 .sub{font-size:13px;color:#d1d5db;font-weight:400;text-transform:none;letter-spacing:0}
    table{width:100%;border-collapse:collapse;font-size:15px}
    th{padding:10px 12px;text-align:left;font-weight:600;color:#f59e0b;font-size:13px;text-transform:uppercase;letter-spacing:.5px;background:#11131c;border-bottom:1px solid #1e1b4b}
    td{padding:9px 12px;text-align:left;border-bottom:1px solid #11131c;color:#c4c9d4;font-variant-numeric:tabular-nums}
    tbody tr:hover{background:#151830!important}
    tbody tr:nth-child(even){background:#0f1119}
    .table-wrap{max-height:400px;overflow-y:auto;overflow-x:auto;border:1px solid #1e1b4b;border-radius:10px}
    .table-wrap thead th{position:sticky;top:0;z-index:3;background:#0b0d14;box-shadow:0 1px 0 #1e1b4b}
    .table-wrap tbody .tot-row td{position:sticky;bottom:0;z-index:2;background:#151830!important;box-shadow:0 -1px 0 #f59e0b}
    .text-right{text-align:right}
    .tot-row td{background:#151830!important;border-top:2px solid #f59e0b;font-weight:700}
    .tabs-group{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#11131c,#1a1d27);border:1px solid #1e1b4b;border-radius:12px;padding:7px 12px;margin-bottom:22px;flex-wrap:wrap}
    .tabs{display:flex;align-items:center;gap:3px}
    .tab-btn{padding:8px 18px;border:none;border-radius:8px;background:transparent;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.2px}
    .tab-btn:hover{color:#e1e7ef;background:rgba(255,255,255,.04)}
    .tab-btn.active{color:#fcd34d;background:linear-gradient(135deg,rgba(120,53,15,.35),rgba(69,25,3,.35));border:1px solid rgba(245,158,11,.3);box-shadow:0 0 14px rgba(245,158,11,.07)}
    .tab-month{color:#4a4d6e;padding:6px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
    .tab-month:hover{color:#c4c9d4;background:rgba(255,255,255,.03)}
    .tab-month.active{color:#a78bfa;background:transparent;border:none;border-bottom:2.5px solid #a78bfa;border-radius:0;padding:6px 14px 3.5px;box-shadow:none}
    footer{text-align:center;padding:16px 20px;font-size:13px;color:#4a4d6e;border-top:1px solid #1e1b4b;margin-top:24px}
    footer strong{color:#6b7280}
  </style>
</head>
<body>
  <header>
    <a href="https://echevarria-bi.github.io/" style="color:#fcd34d;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin-right:16px;white-space:nowrap;padding:8px 18px;border:1.5px solid rgba(245,158,11,0.3);border-radius:10px;background:linear-gradient(135deg,rgba(120,53,15,.25),rgba(69,25,3,.2));transition:all .3s;letter-spacing:.3px" onmouseover="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 20px rgba(245,158,11,0.15)'" onmouseout="this.style.borderColor='rgba(245,158,11,0.3)';this.style.boxShadow='none'">&#8592; Menu</a>
    <h1>&#128222; Dashboard de Campanhas</h1>
  </header>
  <div class="container" id="app">
    <div id="loadingArea" style="text-align:center;padding:60px">
      <div style="color:#f59e0b;margin-bottom:6px"><span class="spinner"></span></div>
      <div style="color:#fcd34d;font-size:14px">Carregando dados...</div>
    </div>
  </div>
  <div id="dashContent"></div>
  <footer id="footer" style="display:none"></footer>

  <script>
    var _dados = null, _activeTab = 'geral', _campInfo = {}, _slugMap = {};
    var GH_OWNER = 'echevarria-bi', GH_REPO = 'campanhas-dashboard', GH_FILE = 'data.json', GH_BRANCH = 'master';

    function limparNome(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '');
    }
    function gerarSlug(dataStr, nomeCamp) {
      var ds = dataStr.replace(/\//g, '');
      var partes = nomeCamp.split('|');
      var nome = partes[0].replace('CAMPANHA ','').trim();
      var setor = partes.length >= 3 ? partes[partes.length-1].trim() : '';
      var sAbr = {TELEVENDAS:'TV', REPRESENTANTES:'RP', ATIVOS:'AT', EXTERNO:'EX', PERDIDO:'PD', 'PRÉ VENDAS':'PV'};
      var sa = sAbr[setor.toUpperCase()] || limparNome(setor).substring(0,2).toUpperCase();
      var curto = limparNome(nome).substring(0,10);
      var diasMatch = nomeCamp.match(/(\d+)\s*[-–]\s*(\d+)/);
      var slug = ds + '_' + curto + '_' + sa;
      if (diasMatch) slug += '_' + diasMatch[1] + '_' + diasMatch[2];
      if (slug.length > 31) slug = slug.substring(0, 31).replace(/_+$/, '');
      return slug;
    }
    function toggleCampanha(slug) {
      var el = document.getElementById('det-' + slug);
      if (!el) return;
      el.style.display = (el.style.display === 'none' || !el.style.display) ? 'table-row' : 'none';
    }

    function fetchRemoteData() {
      return fetch('https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + GH_FILE + '?t=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
        .catch(function() { return null; });
    }

    function carregarDadosRemoto() {
      fetchRemoteData().then(function(data) {
        if (data && data.rows && data.rows.length) {
          _dados = data.rows;
          _campInfo = data.campInfo || {};
          _slugMap = data.slugMap || {};
          renderCampanhas();
          document.getElementById('loadingArea').style.display = 'none';
          var dt = new Date(data.updatedAt);
          document.getElementById('footer').style.display = 'block';
          document.getElementById('footer').innerHTML = 'Última atualização: ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' &middot; <strong>' + (data.fileName || '') + '</strong>';
        } else {
          document.getElementById('loadingArea').innerHTML = '<div style="font-size:40px;margin-bottom:12px;opacity:.5">&#9888;</div><div style="color:#f87171;font-size:14px">Nenhum dado disponível</div><div style="color:#6b7280;font-size:12px;margin-top:8px">Execute atualizar.bat para gerar os dados</div>';
        }
      });
    }

    function fmtCurr(v) { if (v==null||isNaN(v)) return '-'; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

    var icn = function(n,s){s=s||14; return '<i data-lucide="'+n+'" style="display:inline-block;width:'+s+'px;height:'+s+'px;vertical-align:middle;stroke:currentColor;stroke-width:2;flex-shrink:0;margin-right:4px"></i>';};

    function getMonthName(n) {
      return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][n-1];
    }

    function extractMonth(d) {
      if (!d) return 0;
      var p = d.split('/');
      return parseInt(p[1], 10) || 0;
    }

    function renderCampanhas() {
      var dados = _dados;
      if (!dados || !dados.length) {
        document.getElementById('dashContent').innerHTML = '<div class="chart-box"><h2>Campanhas <span class="sub">&rarr; Base de campanhas</span></h2><div style="text-align:center;padding:40px;color:#6b7280">Nenhum dado dispon\u00EDvel.</div></div>';
        return;
      }

      // Build unique month list from data field
      var meses = {};
      dados.forEach(function(r) {
        var m = extractMonth(r.data);
        if (m) meses[m] = getMonthName(m);
      });
      var monthKeys = Object.keys(meses).map(Number).sort();

      // Tabs
      var html = '<div class="tabs-group">';
      html += '<div class="tabs">';
      html += '<button class="tab-btn' + (_activeTab === 'geral' ? ' active' : '') + '" data-tab="geral">' + icn('layout-dashboard',12) + ' Geral</button>';
      for (var ti = 0; ti < monthKeys.length; ti++) {
        var mk = monthKeys[ti];
        html += '<button class="tab-btn tab-month' + (_activeTab === 'm' + mk ? ' active' : '') + '" data-tab="m' + mk + '">' + meses[mk] + '</button>';
      }
      html += '</div></div>';

      // Render content for active tab
      html += renderContent(_activeTab, dados, meses, monthKeys);

      document.getElementById('dashContent').innerHTML = html;
      try { lucide.createIcons(); } catch(e) {}

      // Bind tab clicks
      var btns = document.querySelectorAll('.tab-btn');
      for (var bi = 0; bi < btns.length; bi++) {
        btns[bi].addEventListener('click', function() {
          document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
          this.classList.add('active');
          _activeTab = this.getAttribute('data-tab');
          renderCampanhas();
        });
      }
    }

    function renderContent(tab, dados, meses, monthKeys) {
      var isGeral = tab === 'geral';
      var monthNum = isGeral ? 0 : parseInt(tab.replace('m',''), 10);

      function matchMonth(d, m) { return m === 0 || extractMonth(d) === m; }

      var filtered = dados;

      // Build datasMP grouped by dataN+campanhaM
      var datasMP = {};
      for (var mi = 0; mi < filtered.length; mi++) {
        var mr = filtered[mi];
        if (!mr.campanhaM || !mr.dataN) continue;
        if (!matchMonth(mr.dataN, monthNum)) continue;
        var key = mr.dataN + '|' + mr.campanhaM;
        if (!datasMP[key]) datasMP[key] = {totalClientes: mr.totalClientes, receberam: mr.receberam, slug: getSlug(mr.dataN + '|' + mr.campanhaM) || getSlug(mr.campanhaM) || gerarSlug(mr.dataN, mr.campanhaM)};
      }

      // Build leadsPorData grouped by data+campanha
      // Respondidos = clientes que responderam (todos os registros)
      // Convertidos = clientes que compraram depois do disparo (fat > 0)
      var leadsPorData = {};
      for (var mi = 0; mi < filtered.length; mi++) {
        var mr = filtered[mi];
        if (!mr.data || !mr.campanha) continue;
        if (!matchMonth(mr.data, monthNum)) continue;
        var key = mr.data + '|' + mr.campanha;
        if (!leadsPorData[key]) leadsPorData[key] = {total:0, convertidos:0, faturamento:0, setores:[]};
        leadsPorData[key].total++;
        if (mr.valor > 0) { leadsPorData[key].convertidos++; leadsPorData[key].faturamento += mr.valor; }
        if (mr.setor && leadsPorData[key].setores.indexOf(mr.setor) < 0) leadsPorData[key].setores.push(mr.setor);
      }

      // Cards use lead data for the month
      var totalLeads = 0, totalValor = 0, totalConvertidos = 0;
      Object.keys(leadsPorData).forEach(function(k) {
        var l = leadsPorData[k];
        totalLeads += l.total;
        totalConvertidos += l.convertidos;
        totalValor += l.faturamento;
      });

      var totalReceberamCards = 0;
      Object.keys(datasMP).forEach(function(k) { totalReceberamCards += parseFloat(datasMP[k].receberam) || 0; });

      var h = '<div class="cards">';
      h += '<div class="card"><div class="label">Contatos</div><div class="value" style="color:#60a5fa">' + totalLeads + '</div></div>';
      h += '<div class="card"><div class="label">Receberam</div><div class="value" style="color:#a78bfa">' + totalReceberamCards.toLocaleString('pt-BR') + '</div></div>';
      h += '<div class="card"><div class="label">Convers\u00F5es</div><div class="value" style="color:#34d399">' + totalConvertidos + '</div></div>';
      h += '<div class="card"><div class="label">Faturamento</div><div class="value" style="color:#fbbf24">' + fmtCurr(totalValor) + '</div></div>';
      h += '<div class="card"><div class="label">Taxa Convers\u00E3o</div><div class="value" style="color:#a78bfa">' + (totalLeads > 0 ? (totalConvertidos / totalLeads * 100).toFixed(1) : '0') + '%</div></div>';
      h += '</div>';

      // Sector section — moved up as comparison
      var setores = {};
      filtered.forEach(function(mr) {
        if (!matchMonth(mr.data, monthNum)) return;
        var s = mr.setor || '(sem setor)';
        if (!setores[s]) setores[s] = {contatos:0, convertidos:0, fat:0};
        setores[s].contatos++;
        if (mr.valor > 0) { setores[s].convertidos++; setores[s].fat += mr.valor; }
      });
      var setorKeys = Object.keys(setores).filter(function(k){return k==='Externo'||k==='Televendas';}).sort();
      if (setorKeys.length) {
        h += '<h2 style="font-size:17px;font-weight:700;color:#fcd34d;margin:24px 0 14px 10px;border-left:3px solid #f59e0b;padding-left:10px">' + icn('users',14) + ' Comparativo por Setor</h2>';
        h += '<div class="grid-2">';
        setorKeys.forEach(function(s) {
          var d = setores[s];
          var txConv = d.contatos > 0 ? (d.convertidos / d.contatos * 100).toFixed(1) : '0';
          h += '<div class="chart-box" style="margin-bottom:0">';
          h += '<div style="font-size:16px;font-weight:700;color:#fcd34d;margin-bottom:12px">' + s + '</div>';
          h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">';
          h += '<div><div class="label" style="font-size:12px;color:#6b7280;text-transform:uppercase">Contatos</div><div style="font-size:24px;font-weight:800;color:#60a5fa">' + d.contatos + '</div></div>';
          h += '<div><div class="label" style="font-size:12px;color:#6b7280;text-transform:uppercase">Convers\u00F5es</div><div style="font-size:24px;font-weight:800;color:#34d399">' + d.convertidos + '</div></div>';
          h += '<div><div class="label" style="font-size:12px;color:#6b7280;text-transform:uppercase">Faturamento</div><div style="font-size:24px;font-weight:800;color:#fbbf24">' + fmtCurr(d.fat) + '</div></div>';
          h += '</div>';
          h += '<div style="margin-top:8px;padding:6px 10px;border-radius:6px;background:rgba(52,211,153,0.08);font-size:13px;color:#34d399;font-weight:600">Taxa: ' + txConv + '%</div>';
          h += '</div>';
        });
        h += '</div>';
      }

      // allKeys = union of M-P and lead compound keys
      var allKeys = Object.keys(datasMP);
      Object.keys(leadsPorData).forEach(function(k) {
        if (allKeys.indexOf(k) < 0) allKeys.push(k);
      });
      allKeys.sort(function(a,b) {
        var pa = a.split('|'), pb = b.split('|');
        var da = pa[0].split('/'), db = pb[0].split('/');
        return da[2]-db[2] || da[1]-db[1] || da[0]-db[0] || (pa[1] < pb[1] ? -1 : pa[1] > pb[1] ? 1 : 0);
      });

      // Use pre-built slugMap from server, fall back to generated slug
      function getSlug(campanhaName) {
        return _slugMap[campanhaName] || '';
      }

      if (allKeys.length) {
        var tCli = 0, tRec = 0, tL = 0, tC = 0, tFat = 0;
        allKeys.forEach(function(k) {
          var mp = datasMP[k] || {};
          var l = leadsPorData[k] || {};
          tCli += parseFloat(mp.totalClientes) || 0;
          tRec += parseFloat(mp.receberam) || 0;
          tL += l.total || 0;
          tC += l.convertidos || 0;
          tFat += l.faturamento || 0;
        });
        var funnelMax = Math.max(tCli, tRec, totalLeads, totalConvertidos, 1);

        function funnelW(val) { var p = Math.log(val + 1) / Math.log(tCli + 1) * 100; return Math.max(p, 10); }

        function funnelStg(label, valor, pct, color, conn) {
          var w = funnelW(valor);
          var h = '<div style="display:flex;flex-direction:column;align-items:center;width:100%;margin-bottom:14px">';
          h += '<div style="font-size:14px;color:#d1d5db;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:3px">' + label + '</div>';
          h += '<div style="width:' + w + '%;min-width:100px;height:52px;border-radius:10px;background:linear-gradient(90deg,' + color + ' 0%,' + color + 'cc 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px ' + color + '44,inset 0 1px 0 ' + color + '66">';
          h += '<span style="font-size:21px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5)">' + (typeof valor === 'number' ? valor.toLocaleString('pt-BR') : valor) + '</span>';
          h += '</div>';
          h += '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px">';
          if (conn) {
            h += '<span style="font-size:12px;color:#6b7280">' + conn.desc + '</span>';
            h += '<span style="font-size:12px;font-weight:700;color:' + conn.cor + '">' + conn.tx + '%</span>';
            h += '<span style="font-size:12px;font-weight:600;color:' + conn.cor + '">' + fmtCurr(conn.custo) + '</span>';
          } else {
            h += '<span style="font-size:12px;font-weight:600;color:' + color + '">' + pct + '</span>';
          }
          h += '</div></div>';
          return h;
        }

        function getCustoMes(m) { var c = {'6':117.64, '7':59.71}; return m === 0 ? Object.keys(c).reduce(function(s,k){return s+c[k];},0) : (c[String(m)]||0); }
        var custoTotal = getCustoMes(monthNum);
        var totalReceberam = Object.keys(datasMP).reduce(function(s,dt){return s + (parseFloat(datasMP[dt].receberam)||0);}, 0);
        var fatGlobal = totalValor;
        var ticketMedio = totalConvertidos > 0 ? fatGlobal / totalConvertidos : 0;
        var lucroLiquido = fatGlobal - custoTotal;
        var custoPorConvertido = totalConvertidos > 0 ? custoTotal / totalConvertidos : 0;

        h += '<div class="grid-2">';
        h += '<div class="chart-box" style="display:flex;flex-direction:column">';
        h += '<h2 style="margin-bottom:16px">' + icn('bar-chart-3',14) + ' Custo vs Retorno</h2>';
        h += '<div style="flex:1;display:flex;flex-direction:column;gap:8px">';
        function cb(label, valor, bg, cor) { return '<div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-radius:12px;flex:1;background:' + bg + '"><span style="color:#d1d5db;font-size:17px;font-weight:500">' + label + '</span><span style="color:' + cor + ';font-size:30px;font-weight:800">' + valor + '</span></div>'; }
        h += cb('Total Investido', fmtCurr(custoTotal), 'rgba(248,113,113,0.07)', '#f87171');
        h += cb('Faturamento', fmtCurr(fatGlobal), 'rgba(52,211,153,0.07)', '#34d399');
        h += cb('Ticket M\u00E9dio', fmtCurr(ticketMedio), 'rgba(96,165,250,0.07)', '#60a5fa');
        h += cb('Custo por Convertido', fmtCurr(custoPorConvertido), 'rgba(167,139,250,0.07)', '#a78bfa');
        h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-radius:12px;flex:1;background:rgba(52,211,153,0.07)"><span style="color:#d1d5db;font-size:17px;font-weight:500">Convertidos</span><span style="color:#34d399;font-size:30px;font-weight:800">' + totalConvertidos.toLocaleString('pt-BR') + '</span></div>';
        h += '</div></div>';
        h += '<div class="chart-box" style="display:flex;flex-direction:column">';
        h += '<h2 style="margin-bottom:16px">' + icn('funnel',14) + ' Funil de Convers\u00E3o <span class="sub">&rarr; Fluxo geral</span></h2>';
        h += '<div style="padding:6px 0;flex:1;display:flex;flex-direction:column;align-items:center">';
        var txEntrega = tCli > 0 ? (tRec / tCli * 100).toFixed(2) : '0.00';
        var txContato = tRec > 0 ? (totalLeads / tRec * 100).toFixed(2) : '0.00';
        var txConv = totalLeads > 0 ? (totalConvertidos / totalLeads * 100).toFixed(2) : '0.00';
        var txGlobal = tCli > 0 ? (totalConvertidos / tCli * 100).toFixed(2) : '0.00';
        var custoPorContato = totalLeads > 0 ? custoTotal / totalLeads : 0;
        var custoPorReceberam = totalReceberam > 0 ? custoTotal / totalReceberam : 0;
        h += funnelStg('Total Clientes', tCli, '100%', '#60a5fa', null);
        h += funnelStg('Receberam', tRec, txEntrega + '%', '#a78bfa', {tx:txEntrega, desc:'receberam', custo:custoPorReceberam, cor:'#a78bfa'});
        h += funnelStg('Responderam', totalLeads, txContato + '%', '#34d399', {tx:txContato, desc:'responderam', custo:custoPorContato, cor:'#34d399'});
        h += funnelStg('Convertidos', totalConvertidos, txConv + '%', '#f59e0b', {tx:txConv, desc:'compraram', custo:custoPorConvertido, cor:'#f59e0b'});
        var pctNaoAtingidos = tCli > 0 ? ((tCli - tRec) / tCli * 100).toFixed(2) : '0.00';
        var txRec = tRec > 0 ? (totalConvertidos / tRec * 100) : 0;
        var projRecup = tRec > 0 ? Math.round(tCli * totalConvertidos / tRec) : 0;
        var projFat = tRec > 0 && totalConvertidos > 0 ? tCli * totalValor / tRec : 0;
        h += '<div style="margin-top:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06);display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;font-size:15px">';
        h += '<div style="text-align:center;padding:12px 4px;border-radius:8px;background:rgba(52,211,153,0.06)"><div style="color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:6px;font-size:13px">Conv / Receb</div><div style="font-size:24px;font-weight:800;color:#34d399">' + (tRec > 0 ? (totalConvertidos / tRec * 100).toFixed(2) : '0.00') + '%</div><div style="color:#6b7280;margin-top:4px;font-size:13px">' + totalConvertidos + ' / ' + tRec.toLocaleString('pt-BR') + '</div></div>';
        h += '<div style="text-align:center;padding:12px 4px;border-radius:8px;background:rgba(96,165,250,0.06)"><div style="color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:6px;font-size:13px">Taxa Entrega</div><div style="font-size:24px;font-weight:800;color:#60a5fa">' + (tCli > 0 ? (tRec / tCli * 100).toFixed(2) : '0.00') + '%</div><div style="color:#f87171;margin-top:4px;font-size:13px">' + pctNaoAtingidos + '% n\u00E3o atingidos</div></div>';
        h += '</div>';
        var difRecup = projRecup - totalConvertidos;
        var difFat = projFat - totalValor;
        h += '</div></div></div>';

        h += '<div class="chart-box"><h2>' + icn('trophy',14) + ' Ranking de Campanhas <span class="sub">&rarr; Por faturamento (clique na campanha para detalhes)</span></h2><div class="table-wrap"><table><thead><tr><th style="text-align:center">Ranking</th><th>Campanha</th><th>Data</th><th class="text-right">Total Clientes</th><th class="text-right">Receberam</th><th class="text-right">Responderam</th><th class="text-right">Convertidos</th><th class="text-right">Faturamento</th><th>% Conv.</th></tr></thead><tbody>';
        var campRank = {};
        for (var di = 0; di < allKeys.length; di++) {
          var key = allKeys[di];
          var parts = key.split('|');
          var dataDisp = parts[0];
          var camp = parts.length > 1 ? parts.slice(1).join('|') : '(sem campanha)';
          var mp = datasMP[key] || {};
          var l = leadsPorData[key] || {total:0, convertidos:0, faturamento:0, setores:[]};
           var slug = mp.slug || getSlug(camp) || '';
           if (!campRank[key]) campRank[key] = {campanha:camp, data:dataDisp, tCli:0, tRec:0, leads:0, convertidos:0, fat:0, setores:{}, slug:slug};
          campRank[key].tCli += parseFloat(mp.totalClientes) || 0;
          campRank[key].tRec += parseFloat(mp.receberam) || 0;
          campRank[key].leads += l.total || 0;
          campRank[key].convertidos += l.convertidos || 0;
          campRank[key].fat += l.faturamento || 0;
          (l.setores||[]).forEach(function(s){ campRank[key].setores[s]=true; });
        }
        var campArr = Object.keys(campRank).map(function(k){return campRank[k];}).sort(function(a,b){return b.fat - a.fat;});
        campArr.forEach(function(c, i) {
          var pct = c.leads > 0 ? (c.convertidos / c.leads * 100).toFixed(2) : '0.00';
          var bg = i % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'transparent';
          var rankHtml = '';
          if (i === 0) rankHtml = '<span style="font-size:19px">\uD83E\uDD47</span>';
          else if (i === 1) rankHtml = '<span style="font-size:19px">\uD83E\uDD48</span>';
          else if (i === 2) rankHtml = '<span style="font-size:19px">\uD83E\uDD49</span>';
          else rankHtml = '<span style="font-size:16px;font-weight:700;color:#6b7280">' + (i+1) + '</span>';
          var campSafe = (c.slug || '').replace(/'/g, '');
          h += '<tr style="cursor:pointer;background:' + bg + '" onclick="toggleCampanha(\'' + campSafe + '\')">' +
            '<td style="text-align:center">' + rankHtml + '</td>' +
            '<td style="font-size:14px;color:#fcd34d;font-weight:600;max-width:250px">' + c.campanha + '</td>' +
            '<td style="font-size:12px;color:#93c5fd">' + c.data + '</td>' +
            '<td class="text-right" style="color:#60a5fa;font-size:14px">' + (c.tCli || '—') + '</td>' +
            '<td class="text-right" style="color:#a78bfa;font-size:14px">' + (c.tRec || '—') + '</td>' +
            '<td class="text-right" style="color:#34d399;font-size:14px">' + c.leads + '</td>' +
            '<td class="text-right" style="color:#34d399;font-size:14px">' + c.convertidos + '</td>' +
            '<td class="text-right" style="color:#fbbf24;font-size:14px;font-weight:700">' + fmtCurr(c.fat) + '</td>' +
            '<td style="color:#f59e0b;font-size:14px">' + pct + '%</td></tr>';
          // Detail row (hidden)
          h += '<tr id="det-' + campSafe + '" style="display:none"><td colspan="9" style="padding:16px;background:#0f1119;border-bottom:1px solid #1e1b4b">';
          var info = _campInfo[c.slug] || {};
          var imgPath = 'artes/' + c.slug + '.png';
          h += '<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">';
          if (info.texto || info.publico) {
            h += '<div style="flex:2;min-width:250px">';
            if (info.texto) h += '<div style="margin-bottom:12px"><div style="font-size:12px;color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;margin-bottom:4px">Texto do Disparo</div><div style="font-size:15px;color:#d1d5db;line-height:1.6;padding:12px;background:#11131c;border-radius:8px;border:1px solid #1e1b4b">' + info.texto + '</div></div>';
            if (info.publico) h += '<div><div style="font-size:12px;color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;margin-bottom:4px">Público-Alvo</div><div style="font-size:15px;color:#d1d5db;line-height:1.6;padding:12px;background:#11131c;border-radius:8px;border:1px solid #1e1b4b">' + info.publico.replace(/\n/g,'<br>') + '</div></div>';
            h += '</div>';
          }
          h += '<div style="flex:0 0 auto;cursor:zoom-in" onclick="abrirZoom(\'' + imgPath + '\')"><img src="' + imgPath + '" style="max-height:130px;max-width:200px;border-radius:8px;border:1px solid #1e1b4b" onerror="this.parentElement.style.display=\'none\'"></div>';
          h += '</div>';
          var obsKey = c.data + '|' + c.campanha;
          var obsN = 0, obsFat = 0, obsProd = '';
          var obsClientes = [];
          for (var oi = 0; oi < filtered.length; oi++) {
            var orow = filtered[oi];
            if ((orow.data + '|' + orow.campanha) === obsKey && orow.comprouProduto === 'Sim') {
              obsN++; obsFat += orow.valorProduto || 0; obsProd = orow.produto || obsProd;
              obsClientes.push('<span style="color:#a78bfa">' + orow.id + '</span> ' + (orow.vendedor || '—') + ' · <b style="color:#fbbf24">' + fmtCurr(orow.valorProduto || 0) + '</b>');
            }
          }
          if (obsN) {
            h += '<div style="margin-top:14px;padding:12px 14px;border-radius:8px;background:rgba(167,139,250,0.07);border:1px solid rgba(167,139,250,0.22)">';
            h += '<div style="font-size:12px;color:#a78bfa;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;margin-bottom:6px">OBS — Compraram o produto da campanha' + (obsProd ? ' <span style="color:#d1d5db;text-transform:none">(' + obsProd + ')</span>' : '') + '</div>';
            h += '<div style="font-size:15px;color:#d1d5db">' + obsN + ' cliente(s) · <b style="color:#fbbf24">' + fmtCurr(obsFat) + '</b></div>';
            if (obsClientes.length) h += '<div style="margin-top:6px;font-size:13px;color:#9ca3af;line-height:1.8">' + obsClientes.join('<br>') + '</div>';
            h += '</div>';
          }
          h += '</td></tr>';
        });
        h += '<tr class="tot-row"><td></td><td style="font-weight:700">Total</td><td></td>' +
          '<td class="text-right" style="font-weight:700">' + tCli + '</td>' +
          '<td class="text-right" style="font-weight:700">' + tRec + '</td>' +
          '<td class="text-right" style="font-weight:700;color:#34d399">' + tL + '</td>' +
          '<td class="text-right" style="font-weight:700;color:#34d399">' + tC + '</td>' +
          '<td class="text-right" style="font-weight:700;color:#fbbf24">' + fmtCurr(tFat) + '</td>' +
          '<td style="font-weight:700;color:#f59e0b">' + (tL > 0 ? (tC / tL * 100).toFixed(2) : '0.00') + '%</td></tr>';
        h += '</tbody></table></div></div>';
        h += '<div class="chart-box">' +
          '<h2>' + icn('lightbulb',14) + ' Curiosidade <span class="sub">&rarr; Se todos os clientes tivessem recebido a mensagem</span></h2>' +
          '<div style="padding:20px;border-radius:8px;background:rgba(245,158,11,0.06)">' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
            '<div style="padding:14px;border-radius:6px;background:rgba(0,0,0,0.15)">' +
              '<div style="color:#6b7280;font-size:13px;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:8px">Agora (parcial)</div>' +
              '<div style="font-size:15px;color:#9ca3af;line-height:2">' +
                '<span style="color:#a78bfa">' + tRec.toLocaleString('pt-BR') + '</span> receberam<br>' +
                '\u2192 <span style="color:#34d399;font-size:17px;font-weight:600">' + totalConvertidos + '</span> convertidos<br>' +
                '\u2192 <span style="color:#fbbf24;font-size:17px;font-weight:600">' + fmtCurr(totalValor) + '</span>' +
              '</div>' +
            '</div>' +
            '<div style="padding:14px;border-radius:6px;background:rgba(0,0,0,0.15)">' +
              '<div style="color:#f59e0b;font-size:13px;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:8px">Proje\u00E7\u00E3o (100%)</div>' +
              '<div style="font-size:15px;color:#9ca3af;line-height:2">' +
                '<span style="color:#60a5fa">' + tCli.toLocaleString('pt-BR') + '</span> receberiam<br>' +
                '\u2192 <span style="color:#34d399;font-weight:700;font-size:17px">' + projRecup.toLocaleString('pt-BR') + '</span> convertidos <span style="color:#34d399;font-size:13px">(+' + difRecup.toLocaleString('pt-BR') + ')</span><br>' +
                '\u2192 <span style="color:#fbbf24;font-weight:700;font-size:17px">' + fmtCurr(projFat) + '</span> <span style="color:#fbbf24;font-size:13px">(+' + fmtCurr(difFat) + ')</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:14px;padding:14px 16px;border-radius:6px;background:rgba(0,0,0,0.15);font-size:14px;color:#9ca3af;line-height:1.9">' +
            'Como foi calculado:<br>' +
            '1. Taxa de convers\u00E3o: <b style="color:#34d399">' + totalConvertidos + '</b> convertidos \u00F7 <b style="color:#a78bfa">' + tRec.toLocaleString('pt-BR') + '</b> receberam = <b style="color:#f59e0b">' + txRec.toFixed(2) + '%</b><br>' +
            '2. Proje\u00E7\u00E3o de convertidos: <b style="color:#60a5fa">' + tCli.toLocaleString('pt-BR') + '</b> totais \u00D7 <b style="color:#f59e0b">' + txRec.toFixed(2) + '%</b> = <b style="color:#34d399">' + projRecup.toLocaleString('pt-BR') + '</b> convertidos<br>' +
            '3. Ticket m\u00E9dio atual por convertido: <b style="color:#fbbf24">' + fmtCurr(totalValor) + '</b> \u00F7 <b style="color:#34d399">' + totalConvertidos + '</b> conv = <b style="color:#60a5fa">' + fmtCurr(ticketMedio) + '</b><br>' +
            '4. Proje\u00E7\u00E3o de faturamento: <b style="color:#34d399">' + projRecup.toLocaleString('pt-BR') + '</b> conv \u00D7 <b style="color:#60a5fa">' + fmtCurr(ticketMedio) + '</b> = <b style="color:#fbbf24">' + fmtCurr(projFat) + '</b>' +
          '</div></div></div>';
      }

      return h;
    }

    carregarDadosRemoto();
  </script>
  <style>
      .spinner{display:inline-block;width:16px;height:16px;border:2px solid #1e1b4b;border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;justify-content:center;align-items:center;cursor:zoom-out}
    .lightbox.show{display:flex}
    .lightbox img{max-width:92vw;max-height:92vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6);cursor:default}
    .lightbox .close{position:fixed;top:20px;left:20px;width:36px;height:36px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:10000}
    .lightbox .close:hover{background:rgba(245,158,11,.3);border-color:#f59e0b}
  </style>
  <div class="lightbox" id="lightbox" onclick="fecharZoom()">
    <button class="close" onclick="event.stopPropagation();fecharZoom()">&#10005;</button>
    <img id="lightbox-img" src="" alt="Zoom">
  </div>
  <script>
    function abrirZoom(path) { document.getElementById('lightbox-img').src = path; document.getElementById('lightbox').classList.add('show'); }
    function fecharZoom() { document.getElementById('lightbox').classList.remove('show'); document.getElementById('lightbox-img').src = ''; }
  </script>
</body>
</html>

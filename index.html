<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard de Campanhas</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0d14;color:#e1e7ef}
    header{background:linear-gradient(135deg,#11131c,#1a1d27);border-bottom:1px solid #1e1b4b;padding:20px 32px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
    header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#f59e0b,#fb923c,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
    .container{max-width:1200px;margin:0 auto;padding:24px 32px}
    .upload-area{display:block;border:2px dashed #1e1b4b;border-radius:16px;padding:56px;text-align:center;background:linear-gradient(135deg,#11131c,#1a1d27);cursor:pointer;transition:.3s}
    .upload-area:hover{border-color:#f59e0b;background:linear-gradient(135deg,#151830,#1e2030)}
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
    .card{background:linear-gradient(135deg,#11131c,#1a1d27);border:1px solid #1e1b4b;border-radius:14px;padding:20px 24px;transition:.2s}
    .card:hover{border-color:#f59e0b;transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,.08)}
    .card .label{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
    .card .value{font-size:26px;font-weight:800;margin-top:3px;color:#f0f2f8;line-height:1.2}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:768px){.grid-2,.cards{grid-template-columns:1fr}.container{padding:16px}}
    .chart-box{background:linear-gradient(135deg,#11131c,#1a1d27);border:1px solid #1e1b4b;border-radius:14px;padding:20px;margin-bottom:20px;transition:.2s}
    .chart-box:hover{border-color:#78350f}
    .chart-box h2{font-size:12px;font-weight:700;margin-bottom:14px;color:#fcd34d;text-transform:uppercase;letter-spacing:.7px;padding-left:10px;border-left:3px solid #f59e0b}
    .chart-box h2 .sub{font-size:11px;color:#d1d5db;font-weight:400;text-transform:none;letter-spacing:0}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{padding:10px 12px;text-align:left;font-weight:600;color:#f59e0b;font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:#11131c;border-bottom:1px solid #1e1b4b}
    td{padding:9px 12px;text-align:left;border-bottom:1px solid #11131c;color:#c4c9d4;font-variant-numeric:tabular-nums}
    tbody tr:hover{background:#151830!important}
    tbody tr:nth-child(even){background:#0f1119}
    .table-wrap{max-height:400px;overflow-y:auto;overflow-x:auto;border:1px solid #1e1b4b;border-radius:10px}
    .table-wrap thead th{position:sticky;top:0;z-index:3;background:#0b0d14;box-shadow:0 1px 0 #1e1b4b}
    .table-wrap tbody .tot-row td{position:sticky;bottom:0;z-index:2;background:#151830!important;box-shadow:0 -1px 0 #f59e0b}
    .text-right{text-align:right}
    .tot-row td{background:#151830!important;border-top:2px solid #f59e0b;font-weight:700}
    .tabs-group{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#11131c,#1a1d27);border:1px solid #1e1b4b;border-radius:12px;padding:7px 12px;margin-bottom:22px;flex-wrap:wrap}
    .tabs{display:flex;align-items:center;gap:3px}
    .tab-btn{padding:8px 18px;border:none;border-radius:8px;background:transparent;color:#6b7280;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.2px}
    .tab-btn:hover{color:#e1e7ef;background:rgba(255,255,255,.04)}
    .tab-btn.active{color:#fcd34d;background:linear-gradient(135deg,rgba(120,53,15,.35),rgba(69,25,3,.35));border:1px solid rgba(245,158,11,.3);box-shadow:0 0 14px rgba(245,158,11,.07)}
    .tab-month{color:#4a4d6e;padding:6px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
    .tab-month:hover{color:#c4c9d4;background:rgba(255,255,255,.03)}
    .tab-month.active{color:#a78bfa;background:transparent;border:none;border-bottom:2.5px solid #a78bfa;border-radius:0;padding:6px 14px 3.5px;box-shadow:none}
    footer{text-align:center;padding:16px 20px;font-size:11px;color:#4a4d6e;border-top:1px solid #1e1b4b;margin-top:24px}
    footer strong{color:#6b7280}
    .btn-token{background:transparent;border:1px solid #4a4d6e;color:#9ca3af;padding:4px 10px;border-radius:6px;font-size:10px;cursor:pointer;display:none}
    .btn-token:hover{border-color:#f59e0b;color:#fcd34d}
    .input-token{width:120px;background:#11131c;border:1px solid #1e1b4b;border-radius:6px;padding:4px 8px;color:#e1e7ef;font-size:11px;outline:none;display:none}
  </style>
</head>
<body>
  <header>
    <h1>&#128222; Dashboard de Campanhas</h1>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="statusFile" style="font-size:11px;color:#6b7280"></span>
      <span id="tokenStatus" style="font-size:10px;color:#6b7280"></span>
      <input type="password" id="tokenInput" class="input-token" placeholder="Token GitHub" onkeydown="if(event.key==='Enter'){setToken(this.value);this.style.display='none'}">
      <button onclick="document.getElementById('tokenInput').style.display='inline-block';document.getElementById('tokenInput').focus()" class="btn-token" id="btnToken">&#128274; Token</button>
      <button onclick="novoArquivo()" style="background:#1e1b4b;border:1px solid #78350f;color:#fcd34d;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:none" id="btnNovoArquivo">&#128193; Novo arquivo</button>
    </div>
  </header>
  <div class="container" id="app">
    <div style="position:relative;width:100%">
      <input type="file" id="inputArquivo" accept=".xlsx,.xls" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:5;font-size:0" onchange="processFile(this.files[0])">
      <div class="upload-area" id="areaInicial" ondragover="this.classList.add('dragover');event.preventDefault()" ondragleave="this.classList.remove('dragover')" ondrop="event.preventDefault();this.classList.remove('dragover');if(event.dataTransfer.files[0])processFile(event.dataTransfer.files[0])">
        <div style="font-size:48px;margin-bottom:12px;opacity:.5">&#128194;</div>
        <div style="font-size:16px;color:#9ca3af;font-weight:500">Clique para selecionar o arquivo</div>
        <div style="font-size:13px;color:#4a4d6e;margin-top:4px">RELATÓRIO - CAMPANHAS.xlsx</div>
      </div>
    </div>
  </div>
  <div id="dashContent"></div>
  <footer id="footer" style="display:none"></footer>

  <script>
    var _dados = null, _activeTab = 'geral', _campInfo = {};
    var GH_OWNER = 'echevarria-bi', GH_REPO = 'campanhas-dashboard', GH_FILE = 'data.json', GH_BRANCH = 'master';

    function limparNome(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '');
    }
    function gerarSlug(dataStr, nomeCamp) {
      var ds = dataStr.replace(/\//g, '');
      var partes = nomeCamp.split('|');
      var nome = partes[0].replace('CAMPANHA ','').trim();
      var setor = partes.length >= 3 ? partes[partes.length-1].trim() : '';
      var sAbr = {TELEVENDAS:'TV', REPRESENTANTES:'RP', ATIVOS:'AT', EXTERNO:'EX', PERDIDO:'PD', 'PRÉ VENDAS':'PV'};
      var sa = sAbr[setor.toUpperCase()] || limparNome(setor).substring(0,2).toUpperCase();
      var curto = limparNome(nome).substring(0,10);
      var diasMatch = nomeCamp.match(/(\d+)\s*[-–]\s*(\d+)/);
      var slug = ds + '_' + curto + '_' + sa;
      if (diasMatch) slug += '_' + diasMatch[1] + '_' + diasMatch[2];
      if (slug.length > 31) slug = slug.substring(0, 31).replace(/_+$/, '');
      return slug;
    }
    function toggleCampanha(slug) {
      var el = document.getElementById('det-' + slug);
      if (!el) return;
      el.style.display = (el.style.display === 'none' || !el.style.display) ? 'table-row' : 'none';
    }

    function processBuffer(buf, nome) {
      try {
        var data = new Uint8Array(buf);
        var wb = XLSX.read(data, {type:'array'});
        _dados = parseCampanhas(wb);
        renderCampanhas();
        document.getElementById('areaInicial').parentElement.style.display = 'none';
        document.getElementById('btnNovoArquivo').style.display = 'inline-flex';
        var now = new Date();
        document.getElementById('footer').style.display = 'block';
        document.getElementById('footer').innerHTML = '<strong>' + nome + '</strong> &middot; ' + now.toLocaleDateString('pt-BR') + ' &agrave;s ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
        document.getElementById('statusFile').textContent = 'Carregado';
        document.getElementById('statusFile').style.color = '#34d399';
        setTimeout(function() { document.getElementById('statusFile').textContent = ''; }, 3000);
        mostrarTokenSeNecessario();
        saveRemoteData(_dados, _campInfo, nome).then(function(ok) {
          if (ok) {
            document.getElementById('tokenStatus').textContent = 'Salvo no repositório';
            document.getElementById('tokenStatus').style.color = '#34d399';
            setTimeout(function() { document.getElementById('tokenStatus').textContent = 'Dados remotos'; }, 4000);
          }
        });
      } catch(err) {
        document.getElementById('areaInicial').innerHTML = '<div style="font-size:40px;margin-bottom:8px">&#9888;</div><div style="color:#f87171;font-size:14px">Erro: ' + err.message + '</div><div style="color:#4a4d6e;font-size:12px;margin-top:4px;cursor:pointer" onclick="document.getElementById(\'inputArquivo\').click()">Clique para tentar novamente</div>';
      }
    }

    function processFile(file) {
      if (!file) return;
      document.getElementById('areaInicial').innerHTML = '<div style="color:#f59e0b;margin-bottom:6px"><span class="spinner"></span></div><div style="color:#fcd34d;font-size:14px">Processando ' + file.name + '...</div>';
      var reader = new FileReader();
      reader.onload = function(ev) { processBuffer(ev.target.result, file.name); };
      reader.readAsArrayBuffer(file);
    }

    function autoLoad() {
      var area = document.getElementById('areaInicial');
      area.innerHTML = '<div style="color:#f59e0b;margin-bottom:6px"><span class="spinner"></span></div><div style="color:#fcd34d;font-size:14px">Carregando dados...</div>';
      fetch('RELATÓRIO - CAMPANHAS.xlsx').then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      }).then(function(buf) {
        processBuffer(buf, 'RELATÓRIO - CAMPANHAS.xlsx');
      }).catch(function() {
        area.innerHTML = '<div style="font-size:40px;margin-bottom:12px;opacity:.5">&#128194;</div><div style="font-size:16px;color:#9ca3af;font-weight:500">Clique para selecionar o arquivo</div><div style="font-size:13px;color:#4a4d6e;margin-top:4px">RELATÓRIO - CAMPANHAS.xlsx</div>';
        mostrarTokenSeNecessario();
      });
    }

    function novoArquivo() {
      document.getElementById('areaInicial').parentElement.style.display = 'block';
      document.getElementById('areaInicial').innerHTML = '<div style="font-size:48px;margin-bottom:12px;opacity:.5">&#128194;</div><div style="font-size:16px;color:#9ca3af;font-weight:500">Clique para selecionar o arquivo</div><div style="font-size:13px;color:#4a4d6e;margin-top:4px">RELATÓRIO - CAMPANHAS.xlsx</div>';
      document.getElementById('dashContent').innerHTML = '';
      document.getElementById('footer').style.display = 'none';
      document.getElementById('btnNovoArquivo').style.display = 'none';
      _dados = null;
      _campInfo = {};
      document.getElementById('tokenStatus').textContent = '';
      mostrarTokenSeNecessario();
    }

    function getToken() { try { return localStorage.getItem('campToken') || ''; } catch(e) { return ''; } }

    function setToken(t) {
      if (!t) return;
      try { localStorage.setItem('campToken', t); } catch(e) {}
      document.getElementById('tokenStatus').textContent = 'Token salvo';
      document.getElementById('tokenStatus').style.color = '#34d399';
      document.getElementById('btnToken').style.display = 'none';
    }

    function fetchRemoteData() {
      return fetch('https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + GH_FILE + '?t=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
        .catch(function() { return null; });
    }

    function saveRemoteData(rows, campInfo, fileName) {
      var token = getToken();
      if (!token) {
        document.getElementById('tokenStatus').textContent = 'Token não configurado';
        document.getElementById('tokenStatus').style.color = '#f87171';
        document.getElementById('btnToken').style.display = 'inline-flex';
        return Promise.resolve(false);
      }
      var payload = { rows: rows, campInfo: campInfo, updatedAt: new Date().toISOString(), fileName: fileName || '' };
      var content = JSON.stringify(payload, null, 2);
      var base64 = btoa(unescape(encodeURIComponent(content)));
      var url = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_FILE;
      document.getElementById('tokenStatus').textContent = 'Salvando...';
      document.getElementById('tokenStatus').style.color = '#f59e0b';
      return fetch(url + '?ref=' + GH_BRANCH, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.v3+json' } })
        .then(function(r) {
          if (r.status === 404) return null;
          if (!r.ok) return r.json().then(function(j) { throw new Error(JSON.stringify(j)); });
          return r.json();
        })
        .then(function(existing) {
          var body = { message: 'Atualização ' + (fileName || '') + ' - ' + new Date().toLocaleString('pt-BR'), content: base64, branch: GH_BRANCH };
          if (existing && existing.sha) body.sha = existing.sha;
          return fetch(url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' }, body: JSON.stringify(body) });
        })
        .then(function(r) {
          if (!r.ok) return r.json().then(function(j) { throw new Error(JSON.stringify(j)); });
          return true;
        })
        .catch(function(err) {
          console.error('saveRemoteData error:', err);
          document.getElementById('tokenStatus').textContent = err.message;
          document.getElementById('tokenStatus').style.color = '#f87171';
          return false;
        });
    }

    function carregarDadosRemoto() {
      fetchRemoteData().then(function(data) {
        if (data && data.rows && data.rows.length) {
          _dados = data.rows;
          _campInfo = data.campInfo || {};
          renderCampanhas();
          document.getElementById('areaInicial').parentElement.style.display = 'none';
          document.getElementById('btnNovoArquivo').style.display = 'inline-flex';
          var dt = new Date(data.updatedAt);
          document.getElementById('footer').style.display = 'block';
          document.getElementById('footer').innerHTML = 'Última atualização: ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' &middot; <strong>' + (data.fileName || '') + '</strong>';
          if (getToken()) document.getElementById('btnToken').style.display = 'none';
          else document.getElementById('btnToken').style.display = 'inline-flex';
          document.getElementById('tokenStatus').textContent = 'Dados remotos';
          document.getElementById('tokenStatus').style.color = '#6b7280';
        } else {
          autoLoad();
        }
      });
    }

    function mostrarTokenSeNecessario() {
      if (!getToken()) document.getElementById('btnToken').style.display = 'inline-flex';
    }

    function parseCampanhas(wb) {
      // Read campaign info from per-campaign sheets
      _campInfo = {};
      wb.SheetNames.forEach(function(s) {
        if (s === 'Dados Geral' || s === 'Resumo por RCA' || s === 'Planilha1') return;
        var cws = wb.Sheets[s];
        var crows = XLSX.utils.sheet_to_json(cws, {header:1, defval:''});
        _campInfo[s] = {
          texto: (crows[4] && crows[4][0]) ? String(crows[4][0]).trim() : '',
          publico: (crows[8] && crows[8][0]) ? String(crows[8][0]).trim() : ''
        };
      });

      // Read main data from Dados Geral sheet
      var ws = wb.Sheets['Dados Geral'];
      if (!ws) throw new Error('Aba "Dados Geral" não encontrada no arquivo.');
      var raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      var rows = [];
      for (var ri = 1; ri < raw.length; ri++) {
        var r = raw[ri];
        if (!r || !r[0] || !r[4]) continue;
        rows.push({
          id: r[0],
          resposta: String(r[1]).trim(),
          cod: String(r[2]).trim(),
          vendedor: String(r[3]).trim(),
          setor: String(r[4]).trim(),
          regiao: String(r[5]).trim(),
          supervisor: String(r[6]).trim(),
          campanha: String(r[7]).trim(),
          data: typeof r[8] === 'number' ? XLSX.SSF.format('dd/mm/yyyy', r[8]) : String(r[8]).trim(),
          compra: r[9],
          valor: parseFloat(r[10]) || 0,
          campanhaM: String(r[12]).trim(),
          dataN: typeof r[13] === 'number' ? XLSX.SSF.format('dd/mm/yyyy', r[13]) : String(r[13]).trim(),
          totalClientes: r[14],
          receberam: r[15]
        });
      }
      return rows;
    }

    function fmtCurr(v) { if (v==null||isNaN(v)) return '-'; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

    var icn = function(n,s){s=s||14; return '<i data-lucide="'+n+'" style="display:inline-block;width:'+s+'px;height:'+s+'px;vertical-align:middle;stroke:currentColor;stroke-width:2;flex-shrink:0;margin-right:4px"></i>';};

    function getMonthName(n) {
      return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][n-1];
    }

    function extractMonth(d) {
      if (!d) return 0;
      var p = d.split('/');
      return parseInt(p[1], 10) || 0;
    }

    function renderCampanhas() {
      var dados = _dados;
      if (!dados || !dados.length) {
        document.getElementById('dashContent').innerHTML = '<div class="chart-box"><h2>Campanhas <span class="sub">&rarr; Base de campanhas</span></h2><div style="text-align:center;padding:40px;color:#6b7280">Nenhum dado dispon\u00EDvel.</div></div>';
        return;
      }

      // Build unique month list from data field
      var meses = {};
      dados.forEach(function(r) {
        var m = extractMonth(r.data);
        if (m) meses[m] = getMonthName(m);
      });
      var monthKeys = Object.keys(meses).map(Number).sort();

      // Tabs
      var html = '<div class="tabs-group">';
      html += '<div class="tabs">';
      html += '<button class="tab-btn' + (_activeTab === 'geral' ? ' active' : '') + '" data-tab="geral">' + icn('layout-dashboard',12) + ' Geral</button>';
      for (var ti = 0; ti < monthKeys.length; ti++) {
        var mk = monthKeys[ti];
        html += '<button class="tab-btn tab-month' + (_activeTab === 'm' + mk ? ' active' : '') + '" data-tab="m' + mk + '">' + meses[mk] + '</button>';
      }
      html += '</div></div>';

      // Render content for active tab
      html += renderContent(_activeTab, dados, meses, monthKeys);

      document.getElementById('dashContent').innerHTML = html;
      try { lucide.createIcons(); } catch(e) {}

      // Bind tab clicks
      var btns = document.querySelectorAll('.tab-btn');
      for (var bi = 0; bi < btns.length; bi++) {
        btns[bi].addEventListener('click', function() {
          document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
          this.classList.add('active');
          _activeTab = this.getAttribute('data-tab');
          renderCampanhas();
        });
      }
    }

    function renderContent(tab, dados, meses, monthKeys) {
      var isGeral = tab === 'geral';
      var monthNum = isGeral ? 0 : parseInt(tab.replace('m',''), 10);

      function matchMonth(d, m) { return m === 0 || extractMonth(d) === m; }

      var filtered = dados;

      // Build datasMP grouped by dataN+campanhaM
      var datasMP = {};
      for (var mi = 0; mi < filtered.length; mi++) {
        var mr = filtered[mi];
        if (!mr.campanhaM || !mr.dataN) continue;
        if (!matchMonth(mr.dataN, monthNum)) continue;
        var key = mr.dataN + '|' + mr.campanhaM;
        if (!datasMP[key]) datasMP[key] = {totalClientes: mr.totalClientes, receberam: mr.receberam, slug: gerarSlug(mr.dataN, mr.campanhaM)};
      }

      // Build leadsPorData grouped by data+campanha
      var leadsPorData = {};
      for (var mi = 0; mi < filtered.length; mi++) {
        var mr = filtered[mi];
        if (!mr.data || !mr.campanha) continue;
        if (!matchMonth(mr.data, monthNum)) continue;
        var key = mr.data + '|' + mr.campanha;
        if (!leadsPorData[key]) leadsPorData[key] = {total:0, recup:0, faturamento:0, setores:[]};
        leadsPorData[key].total++;
        if (mr.valor > 0) { leadsPorData[key].recup++; leadsPorData[key].faturamento += mr.valor; }
        if (mr.setor && leadsPorData[key].setores.indexOf(mr.setor) < 0) leadsPorData[key].setores.push(mr.setor);
      }

      // Cards use lead data for the month
      var totalLeads = 0, totalValor = 0, totalRecuperados = 0;
      Object.keys(leadsPorData).forEach(function(k) {
        var l = leadsPorData[k];
        totalLeads += l.total;
        totalRecuperados += l.recup;
        totalValor += l.faturamento;
      });

      var h = '<div class="cards">';
      h += '<div class="card"><div class="label">Recuperados</div><div class="value" style="color:#34d399">' + totalRecuperados + '</div></div>';
      h += '<div class="card"><div class="label">Valor Total</div><div class="value" style="color:#fbbf24">' + fmtCurr(totalValor) + '</div></div>';
      h += '</div>';

      // Sector section — moved up as comparison
      var setores = {};
      filtered.forEach(function(mr) {
        if (!matchMonth(mr.data, monthNum)) return;
        var s = mr.setor || '(sem setor)';
        if (!setores[s]) setores[s] = {leads:0, recup:0, fat:0};
        setores[s].leads++;
        if (mr.valor > 0) { setores[s].recup++; setores[s].fat += mr.valor; }
      });
      var setorKeys = Object.keys(setores).filter(function(k){return k==='Externo'||k==='Televendas';}).sort();
      if (setorKeys.length) {
        h += '<h2 style="font-size:14px;font-weight:700;color:#fcd34d;margin:24px 0 14px 10px;border-left:3px solid #f59e0b;padding-left:10px">' + icn('users',14) + ' Comparativo por Setor</h2>';
        h += '<div class="grid-2">';
        setorKeys.forEach(function(s) {
          var d = setores[s];
          h += '<div class="chart-box" style="margin-bottom:0">';
          h += '<div style="font-size:13px;font-weight:700;color:#fcd34d;margin-bottom:12px">' + s + '</div>';
          h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
          h += '<div><div class="label" style="font-size:10px;color:#6b7280;text-transform:uppercase">Recuperados</div><div style="font-size:20px;font-weight:800;color:#34d399">' + d.recup + '</div></div>';
          h += '<div><div class="label" style="font-size:10px;color:#6b7280;text-transform:uppercase">Faturamento</div><div style="font-size:20px;font-weight:800;color:#fbbf24">' + fmtCurr(d.fat) + '</div></div>';
          h += '</div></div>';
        });
        h += '</div>';
      }

      // allKeys = union of M-P and lead compound keys
      var allKeys = Object.keys(datasMP);
      Object.keys(leadsPorData).forEach(function(k) {
        if (allKeys.indexOf(k) < 0) allKeys.push(k);
      });
      allKeys.sort(function(a,b) {
        var pa = a.split('|'), pb = b.split('|');
        var da = pa[0].split('/'), db = pb[0].split('/');
        return da[2]-db[2] || da[1]-db[1] || da[0]-db[0] || (pa[1] < pb[1] ? -1 : pa[1] > pb[1] ? 1 : 0);
      });

      // Build slug lookup by campaign name (from ALL data, not just current month)
      var slugPorCamp = {};
      for (var si = 0; si < dados.length; si++) {
        var sd = dados[si];
        if (!sd.campanhaM || !sd.dataN) continue;
        var sk = sd.dataN + '|' + sd.campanhaM;
        var sp = sk.split('|');
        slugPorCamp[sp.slice(1).join('|')] = gerarSlug(sd.dataN, sd.campanhaM);
      }

      if (allKeys.length) {
        var tCli = 0, tRec = 0, tL = 0, tR = 0, tFat = 0;
        allKeys.forEach(function(k) {
          var mp = datasMP[k] || {};
          var l = leadsPorData[k] || {};
          tCli += parseFloat(mp.totalClientes) || 0;
          tRec += parseFloat(mp.receberam) || 0;
          tL += l.total || 0;
          tR += l.recup || 0;
          tFat += l.faturamento || 0;
        });
        var funnelMax = Math.max(tCli, tRec, totalLeads, totalRecuperados, 1);

        function funnelW(val) { var p = Math.log(val + 1) / Math.log(tCli + 1) * 100; return Math.max(p, 10); }

        function funnelStg(label, valor, pct, color, conn) {
          var w = funnelW(valor);
          var h = '<div style="display:flex;flex-direction:column;align-items:center;width:100%;margin-bottom:10px">';
          h += '<div style="font-size:12px;color:#d1d5db;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:3px">' + label + '</div>';
          h += '<div style="width:' + w + '%;min-width:100px;height:46px;border-radius:10px;background:linear-gradient(90deg,' + color + ' 0%,' + color + 'cc 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px ' + color + '44,inset 0 1px 0 ' + color + '66">';
          h += '<span style="font-size:17px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5)">' + (typeof valor === 'number' ? valor.toLocaleString('pt-BR') : valor) + '</span>';
          h += '</div>';
          h += '<div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px">';
          if (conn) {
            h += '<span style="font-size:10px;color:#6b7280">' + conn.desc + '</span>';
            h += '<span style="font-size:10px;font-weight:700;color:' + conn.cor + '">' + conn.tx + '%</span>';
            h += '<span style="font-size:10px;font-weight:600;color:' + conn.cor + '">' + fmtCurr(conn.custo) + '</span>';
          } else {
            h += '<span style="font-size:10px;font-weight:600;color:' + color + '">' + pct + '</span>';
          }
          h += '</div></div>';
          return h;
        }

        function getCustoMes(m) { var c = {'6':0, '7':58.41}; return m === 0 ? Object.keys(c).reduce(function(s,k){return s+c[k];},0) : (c[String(m)]||0); }
        var custoTotal = getCustoMes(monthNum);
        var totalReceberam = Object.keys(datasMP).reduce(function(s,dt){return s + (parseFloat(datasMP[dt].receberam)||0);}, 0);
        var fatGlobal = totalValor;
        var ticketMedio = totalRecuperados > 0 ? fatGlobal / totalRecuperados : 0;
        var lucroLiquido = fatGlobal - custoTotal;
        var custoPorRecuperado = totalRecuperados > 0 ? custoTotal / totalRecuperados : 0;

        h += '<div class="grid-2">';
        h += '<div class="chart-box" style="display:flex;flex-direction:column">';
        h += '<h2 style="margin-bottom:16px">' + icn('bar-chart-3',14) + ' Custo vs Retorno</h2>';
        h += '<div style="padding:16px 0;flex:1;display:flex;flex-direction:column;justify-content:center">';
        var st = function(label, valor, cor, form) { var f = form === 'curr' ? fmtCurr : function(v) { return typeof v === 'number' ? v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : v; }; var sufixo = form === 'pct' ? '%' : ''; return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="color:#f3f4f6;font-size:14px">' + label + '</span><span style="color:' + cor + ';font-size:20px;font-weight:800;text-shadow:0 0 20px ' + cor + '44">' + f(valor) + sufixo + '</span></div>'; };
        h += st('Total Investido', custoTotal, '#f87171', 'curr');
        h += st('Lucro L\u00EDquido', lucroLiquido, lucroLiquido >= 0 ? '#34d399' : '#f87171', 'curr');
        h += st('Ticket M\u00E9dio por Recuperado', ticketMedio, '#60a5fa', 'curr');
        h += st('Custo por Recuperado', custoPorRecuperado, '#a78bfa', 'curr');
        h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1e1b4b"><span style="color:#f3f4f6;font-size:15px">Recuperados</span><span style="color:#34d399;font-size:22px;font-weight:800">' + totalRecuperados.toLocaleString('pt-BR') + '</span></div>';
        h += '</div></div>';
        h += '<div class="chart-box" style="display:flex;flex-direction:column">';
        h += '<h2 style="margin-bottom:16px">' + icn('funnel',14) + ' Funil de Convers\u00E3o <span class="sub">&rarr; Fluxo geral</span></h2>';
        h += '<div style="padding:6px 0;flex:1;display:flex;flex-direction:column;align-items:center">';
        var txEntrega = tCli > 0 ? (tRec / tCli * 100).toFixed(2) : '0.00';
        var txContato = tRec > 0 ? (totalLeads / tRec * 100).toFixed(2) : '0.00';
        var txConv = totalLeads > 0 ? (totalRecuperados / totalLeads * 100).toFixed(2) : '0.00';
        var txGlobal = tCli > 0 ? (totalRecuperados / tCli * 100).toFixed(2) : '0.00';
        var custoPorContato = totalLeads > 0 ? custoTotal / totalLeads : 0;
        var custoPorReceberam = totalReceberam > 0 ? custoTotal / totalReceberam : 0;
        h += funnelStg('Total Clientes', tCli, '100%', '#60a5fa', null);
        h += funnelStg('Receberam', tRec, txEntrega + '%', '#a78bfa', {tx:txEntrega, desc:'receberam', custo:custoPorReceberam, cor:'#a78bfa'});
        h += funnelStg('Contatos Gerados', totalLeads, txContato + '%', '#34d399', {tx:txContato, desc:'geraram contato', custo:custoPorContato, cor:'#34d399'});
        h += funnelStg('Recuperados', totalRecuperados, txConv + '%', '#f59e0b', {tx:txConv, desc:'convertidos', custo:custoPorRecuperado, cor:'#f59e0b'});
        var pctNaoAtingidos = tCli > 0 ? ((tCli - tRec) / tCli * 100).toFixed(2) : '0.00';
        var projRecup = tRec > 0 ? Math.round(tCli * totalRecuperados / tRec) : 0;
        var projFat = tRec > 0 && totalRecuperados > 0 ? tCli * totalValor / tRec : 0;
        h += '<div style="margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;width:100%;font-size:11px">';
        h += '<div style="text-align:center;padding:8px 2px;border-radius:8px;background:rgba(52,211,153,0.06)"><div style="color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:4px;font-size:9px">Recup / Receb</div><div style="font-size:17px;font-weight:800;color:#34d399">' + (tRec > 0 ? (totalRecuperados / tRec * 100).toFixed(2) : '0.00') + '%</div><div style="color:#6b7280;margin-top:2px;font-size:9px">' + totalRecuperados + ' / ' + tRec.toLocaleString('pt-BR') + '</div></div>';
        h += '<div style="text-align:center;padding:8px 2px;border-radius:8px;background:rgba(251,191,36,0.06)"><div style="color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:4px;font-size:9px">Recup / Total</div><div style="font-size:17px;font-weight:800;color:#fbbf24">' + (tCli > 0 ? (totalRecuperados / tCli * 100).toFixed(2) : '0.00') + '%</div><div style="color:#6b7280;margin-top:2px;font-size:9px">' + totalRecuperados + ' / ' + tCli.toLocaleString('pt-BR') + '</div></div>';
        h += '<div style="text-align:center;padding:8px 2px;border-radius:8px;background:rgba(96,165,250,0.06)"><div style="color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:4px;font-size:9px">Taxa Entrega</div><div style="font-size:17px;font-weight:800;color:#60a5fa">' + (tCli > 0 ? (tRec / tCli * 100).toFixed(2) : '0.00') + '%</div><div style="color:#f87171;margin-top:2px;font-size:9px">' + pctNaoAtingidos + '% incorreto</div></div>';
        h += '<div style="text-align:center;padding:8px 2px;border-radius:8px;background:rgba(245,158,11,0.06)"><div style="color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:4px;font-size:9px">Potencial 100%</div><div style="font-size:15px;font-weight:800;color:#f59e0b">' + projRecup.toLocaleString('pt-BR') + ' recup</div><div style="color:#fbbf24;margin-top:2px;font-size:9px;font-weight:600">' + fmtCurr(projFat) + '</div></div>';
        h += '</div></div></div>';
        h += '</div>';

        h += '<div class="chart-box"><h2>' + icn('trophy',14) + ' Ranking de Campanhas <span class="sub">&rarr; Por faturamento (clique na campanha para detalhes)</span></h2><div class="table-wrap"><table><thead><tr><th style="text-align:center">Ranking</th><th>Campanha</th><th>Data</th><th>Setores</th><th class="text-right">Total Clientes</th><th class="text-right">Receberam</th><th class="text-right">Contatos</th><th class="text-right">Recuperados</th><th class="text-right">Faturamento</th><th>% Rec.</th></tr></thead><tbody>';
        var campRank = {};
        for (var di = 0; di < allKeys.length; di++) {
          var key = allKeys[di];
          var parts = key.split('|');
          var dataDisp = parts[0];
          var camp = parts.length > 1 ? parts.slice(1).join('|') : '(sem campanha)';
          var mp = datasMP[key] || {};
          var l = leadsPorData[key] || {total:0, recup:0, faturamento:0, setores:[]};
           var slug = mp.slug || slugPorCamp[camp] || '';
           if (!campRank[key]) campRank[key] = {campanha:camp, data:dataDisp, tCli:0, tRec:0, leads:0, recup:0, fat:0, setores:{}, slug:slug};
          campRank[key].tCli += parseFloat(mp.totalClientes) || 0;
          campRank[key].tRec += parseFloat(mp.receberam) || 0;
          campRank[key].leads += l.total || 0;
          campRank[key].recup += l.recup || 0;
          campRank[key].fat += l.faturamento || 0;
          (l.setores||[]).forEach(function(s){ campRank[key].setores[s]=true; });
        }
        var campArr = Object.keys(campRank).map(function(k){return campRank[k];}).sort(function(a,b){return b.fat - a.fat;});
        campArr.forEach(function(c, i) {
          var sList = Object.keys(c.setores).sort();
          var pct = c.leads > 0 ? (c.recup / c.leads * 100).toFixed(2) : '0.00';
          var bg = i % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'transparent';
          var rankHtml = '';
          if (i === 0) rankHtml = '<span style="font-size:16px">\uD83E\uDD47</span>';
          else if (i === 1) rankHtml = '<span style="font-size:16px">\uD83E\uDD48</span>';
          else if (i === 2) rankHtml = '<span style="font-size:16px">\uD83E\uDD49</span>';
          else rankHtml = '<span style="font-size:13px;font-weight:700;color:#6b7280">' + (i+1) + '</span>';
          var campSafe = (c.slug || '').replace(/'/g, '');
          h += '<tr style="cursor:pointer;background:' + bg + '" onclick="toggleCampanha(\'' + campSafe + '\')">' +
            '<td style="text-align:center">' + rankHtml + '</td>' +
            '<td style="font-size:11px;color:#fcd34d;font-weight:600;max-width:250px">' + c.campanha + '</td>' +
            '<td style="font-size:10px;color:#93c5fd">' + c.data + '</td>' +
            '<td style="font-size:10px;color:#93c5fd;max-width:180px">' + (sList.length ? sList.join('<br>') : '—') + '</td>' +
            '<td class="text-right" style="color:#60a5fa;font-size:12px">' + (c.tCli || '—') + '</td>' +
            '<td class="text-right" style="color:#a78bfa;font-size:12px">' + (c.tRec || '—') + '</td>' +
            '<td class="text-right" style="color:#34d399;font-size:12px">' + c.leads + '</td>' +
            '<td class="text-right" style="color:#34d399;font-size:12px">' + c.recup + '</td>' +
            '<td class="text-right" style="color:#fbbf24;font-size:12px;font-weight:700">' + fmtCurr(c.fat) + '</td>' +
            '<td style="color:#f59e0b;font-size:12px">' + pct + '%</td></tr>';
          // Detail row (hidden)
          h += '<tr id="det-' + campSafe + '" style="display:none"><td colspan="10" style="padding:16px;background:#0f1119;border-bottom:1px solid #1e1b4b">';
          var info = _campInfo[c.slug] || {};
          var imgPath = 'artes/' + c.slug + '.png';
          h += '<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">';
          if (info.texto || info.publico) {
            h += '<div style="flex:2;min-width:250px">';
            if (info.texto) h += '<div style="margin-bottom:12px"><div style="font-size:10px;color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;margin-bottom:4px">Texto do Disparo</div><div style="font-size:13px;color:#d1d5db;line-height:1.6;padding:12px;background:#11131c;border-radius:8px;border:1px solid #1e1b4b">' + info.texto + '</div></div>';
            if (info.publico) h += '<div><div style="font-size:10px;color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:0.5px;margin-bottom:4px">Público-Alvo</div><div style="font-size:13px;color:#d1d5db;line-height:1.6;padding:12px;background:#11131c;border-radius:8px;border:1px solid #1e1b4b">' + info.publico.replace(/\n/g,'<br>') + '</div></div>';
            h += '</div>';
          }
          h += '<div style="flex:0 0 auto;cursor:zoom-in" onclick="abrirZoom(\'' + imgPath + '\')"><img src="' + imgPath + '" style="max-height:130px;max-width:200px;border-radius:8px;border:1px solid #1e1b4b" onerror="this.parentElement.style.display=\'none\'"></div>';
          h += '</div></td></tr>';
        });
        h += '<tr class="tot-row"><td></td><td style="font-weight:700">Total</td><td></td><td></td>' +
          '<td class="text-right" style="font-weight:700">' + tCli + '</td>' +
          '<td class="text-right" style="font-weight:700">' + tRec + '</td>' +
          '<td class="text-right" style="font-weight:700;color:#34d399">' + tL + '</td>' +
          '<td class="text-right" style="font-weight:700;color:#34d399">' + tR + '</td>' +
          '<td class="text-right" style="font-weight:700;color:#fbbf24">' + fmtCurr(tFat) + '</td>' +
          '<td style="font-weight:700;color:#f59e0b">' + (tL > 0 ? (tR / tL * 100).toFixed(2) : '0.00') + '%</td></tr>';
        h += '</tbody></table></div></div>';
      }

      return h;
    }

    // Try remote data first, fallback to autoLoad
    carregarDadosRemoto();
  </script>
  <style>
      .spinner{display:inline-block;width:16px;height:16px;border:2px solid #1e1b4b;border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;justify-content:center;align-items:center;cursor:zoom-out}
    .lightbox.show{display:flex}
    .lightbox img{max-width:92vw;max-height:92vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6);cursor:default}
    .lightbox .close{position:fixed;top:20px;left:20px;width:36px;height:36px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:10000}
    .lightbox .close:hover{background:rgba(245,158,11,.3);border-color:#f59e0b}
  </style>
  <div class="lightbox" id="lightbox" onclick="fecharZoom()">
    <button class="close" onclick="event.stopPropagation();fecharZoom()">&#10005;</button>
    <img id="lightbox-img" src="" alt="Zoom">
  </div>
  <script>
    function abrirZoom(path) { document.getElementById('lightbox-img').src = path; document.getElementById('lightbox').classList.add('show'); }
    function fecharZoom() { document.getElementById('lightbox').classList.remove('show'); document.getElementById('lightbox-img').src = ''; }
  </script>
</body>
</html>
